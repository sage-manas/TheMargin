# Staging API on Fly.io (docs/DEPLOY.md). Deploy from the repository root:
#   flyctl deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
# DATABASE_URL is a secret (`flyctl secrets set`), never in this file.
app = "the-margin-api-staging"
primary_region = "sin"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  COOKIE_SECURE = "true"
  # Browsers reach the API through the site's /v1 proxy on Vercel, then Fly's
  # edge: two hops to trust for the client IP (rate limits).
  TRUST_PROXY = "2"
  WEB_ORIGINS = "https://the-margin-staging.vercel.app"

[deploy]
  release_command = "./release.sh"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
